<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#012169" />
    <meta
      name="description"
      content="Offline practice and mock tests for the Life in the UK Test — by category or random."
    />
    <title>Life in the UK · Practice</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest?v=20261019e" />
    <meta name="apple-mobile-web-app-title" content="Life in the UK" />
    <link rel="stylesheet" href="css/styles.css?v=20261019e" />
  </head>
  <body>
    <div class="app">
      <header class="app-header" id="appHeader">
        <button class="icon-btn" id="backBtn" aria-label="Back" hidden>‹</button>
        <div class="header-titles">
          <span class="brand">🇬🇧 Life in the UK</span>
          <span class="subtitle" id="headerSubtitle">Practice</span>
        </div>
        <div class="header-right" id="headerRight">
          <span class="header-extra" id="headerExtra"></span>
          <button
            class="icon-btn install-btn"
            id="installBtn"
            type="button"
            aria-label="Add this app to your home screen"
            title="Add this app to your home screen"
            hidden
          >
            <svg
              viewBox="0 0 24 24"
              width="17"
              height="17"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 3v11" />
              <path d="M8 10.5l4 4 4-4" />
              <path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17" />
            </svg>
          </button>
          <a
            class="gh-btn"
            id="ghBtn"
            href="https://github.com/imnelsonchan-code/life-in-the-uk-test"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open the project on GitHub"
            title="Open the project on GitHub"
          >
            <span class="gh-ico" aria-hidden="true"></span>
            <span class="gh-label">GitHub</span>
            <span class="gh-count" id="ghCount" hidden></span>
          </a>
        </div>
      </header>

      <main id="main" class="app-main" aria-live="polite">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading question pool…</p>
        </div>
      </main>

      <nav class="tabbar" id="tabbar">
        <button class="tab is-active" data-tab="practice">
          <span class="tab-ico">📚</span><span>Practice</span>
        </button>
        <button class="tab" data-tab="plan">
          <span class="tab-ico">🗓️</span><span>Plan</span>
        </button>
        <button class="tab" data-tab="mock">
          <span class="tab-ico">⏱️</span><span>Mock</span>
        </button>
        <button class="tab" data-tab="stats">
          <span class="tab-ico">📊</span><span>Stats</span>
        </button>
        <button class="tab" data-tab="verify">
          <span class="tab-ico">✅</span><span>Verify</span>
        </button>
        <button class="tab" data-tab="user">
          <span class="tab-ico">👤</span><span>User</span>
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="js/app.js?v=20261019e"></script>
  </body>
</html>
