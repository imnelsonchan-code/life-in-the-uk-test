<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#012169" />
    <meta
      name="description"
      content="Offline practice and mock tests for the Life in the UK Test — by category or random."
    />
    <title>Life in the UK · Practice</title>
    <link rel="stylesheet" href="css/styles.css?v=20261019" />
  </head>
  <body>
    <div class="app">
      <header class="app-header" id="appHeader">
        <button class="icon-btn" id="backBtn" aria-label="Back" hidden>‹</button>
        <div class="header-titles">
          <span class="brand">🇬🇧 Life in the UK</span>
          <span class="subtitle" id="headerSubtitle">Practice</span>
        </div>
        <div class="header-right" id="headerRight"></div>
      </header>

      <main id="main" class="app-main" aria-live="polite">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading question pool…</p>
        </div>
      </main>

      <nav class="tabbar" id="tabbar">
        <button class="tab is-active" data-tab="practice">
          <span class="tab-ico">📚</span><span>Practice</span>
        </button>
        <button class="tab" data-tab="plan">
          <span class="tab-ico">🗓️</span><span>Plan</span>
        </button>
        <button class="tab" data-tab="mock">
          <span class="tab-ico">⏱️</span><span>Mock</span>
        </button>
        <button class="tab" data-tab="stats">
          <span class="tab-ico">📊</span><span>Stats</span>
        </button>
        <button class="tab" data-tab="verify">
          <span class="tab-ico">✅</span><span>Verify</span>
        </button>
        <button class="tab" data-tab="user">
          <span class="tab-ico">👤</span><span>User</span>
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="js/app.js?v=20261019"></script>
  </body>
</html>
