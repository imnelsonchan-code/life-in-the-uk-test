server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip the text assets (question JSON compresses well)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # never cache the shell during development of the pool
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
